function load(){key=dayKey();setupTarget(selectedTarget);start=dailyStart(key);path=[start];hints=0;$('word').value='';$('word').minLength=TARGET.length;$('word').maxLength=TARGET.length;$('word').pattern='[A-Za-z]{'+TARGET.length+'}';try{const stored=localStorage.getItem('rohanle-v5-'+TARGET+'-'+key);const data=JSON.parse(stored===null&&dailyTarget(key)===TARGET?localStorage.getItem('rohanle-v4-'+key):stored);if(data&&Array.isArray(data.path)&&data.path[0]===start&&data.path.every((w,i)=>WORDS.has(w)&&(i===0||oneEdit(data.path[i-1],w)))&&!data.path.slice(0,-1).includes(TARGET)){path=data.path;hints=Number.isInteger(data.hints)&&data.hints>=0?data.hints:0}}catch{}document.querySelector('h1').textContent=gameNames[TARGET];document.title=gameNames[TARGET];$('game').setAttribute('aria-labelledby','tab-'+TARGET);for(const tab of document.querySelectorAll('[role=tab]')){const active=tab.dataset.target===TARGET;tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1}$('goal').replaceChildren(...[...TARGET].map(c=>{const tile=document.createElement('span');tile.className='tile';tile.textContent=c;return tile}));$('goal').setAttribute('aria-label',TARGET);$('date').textContent=key;$('puzzle').textContent=start.toUpperCase();$('message').textContent='';render()}
function checkDay(){if(dayKey()!==key){load();$('message').textContent='New puzzle.';return true}return false}
function makeTiles(word){return [...word].map((c,i)=>{const tile=document.createElement('span');tile.className='letter '+(c===TARGET[i]?'correct':'absent');tile.textContent=c;return tile})}
function preview(){const value=$('word').value.toLowerCase();$('entry-tiles').replaceChildren(...Array.from({length:TARGET.length},(_,i)=>{const tile=document.createElement('span');tile.className='letter pending'+(value[i]?' filled':'');tile.textContent=value[i]||'';return tile}))}
function shareResult(){return gameNames[TARGET]+' '+key+' → '+TARGET.toUpperCase()+' '+(path.length-1)+'/'+distance.get(start)+(hints?' · '+hints+' hints':'')+'\n'+path.map(w=>[...w].map((c,i)=>c===TARGET[i]?'🟩':'⬜').join('')).join('\n')}
function render(){const won=path.at(-1)===TARGET;$('ladder').replaceChildren(...path.map((w,i)=>{const li=document.createElement('li');li.className='word-row';li.setAttribute('aria-label',w.toUpperCase()+(i===0?', start':w===TARGET?', destination':''));li.append(...makeTiles(w));return li}));$('count').textContent=(path.length-1)+' moves';$('word').disabled=won;$('submit').disabled=won;$('undo').disabled=path.length===1;$('hint').disabled=won;$('share').hidden=!won;$('result').hidden=!won;$('result').value=won?shareResult():'';$('result').rows=path.length+1;preview();if(won)$('message').textContent='You reached '+TARGET.toUpperCase()+' in '+(path.length-1)+' moves! Shortest route: '+distance.get(start)+'.'+(hints?' Hints used: '+hints+'.':'');}
$('word').addEventListener('input',preview);
$('form').addEventListener('submit',e=>{e.preventDefault();if(checkDay())return;const w=$('word').value.trim().toLowerCase();if(path.at(-1)===TARGET)return;if(w.length!==TARGET.length){$('message').textContent='Enter a '+TARGET.length+'-letter word.';return}if(!WORDS.has(w)){$('message').textContent='That word isn’t in the dictionary. Try another.';return}if(!oneEdit(path.at(-1),w)){$('message').textContent='Change exactly one letter. Keep the word length the same.';return}path.push(w);$('word').value='';$('message').textContent='';save();render();if(w!==TARGET)$('word').focus()});
$('undo').onclick=()=>{if(checkDay()||path.length<2)return;path.pop();$('message').textContent='';save();render();$('word').focus()};
$('hint').onclick=()=>{if(checkDay()||path.at(-1)===TARGET)return;hints++;save();$('message').textContent='Try '+toward.get(path.at(-1)).toUpperCase()+' next.'};
$('share').onclick=async()=>{if(checkDay())return;const result=shareResult();try{await navigator.clipboard.writeText(result);$('message').textContent='Result copied!'}catch{$('result').focus();$('result').select();$('message').textContent='Select and copy your result below.'}};
const tabs=[...document.querySelectorAll('[role=tab]')];
function selectTab(tab){save();selectedTarget=tab.dataset.target;load()}
for(const tab of tabs){tab.onclick=()=>selectTab(tab);tab.onkeydown=e=>{let next;if(e.key==='ArrowRight')next=(tabs.indexOf(tab)+1)%tabs.length;else if(e.key==='ArrowLeft')next=(tabs.indexOf(tab)+tabs.length-1)%tabs.length;else if(e.key==='Home')next=0;else if(e.key==='End')next=tabs.length-1;else return;e.preventDefault();selectTab(tabs[next]);tabs[next].focus()}}
load();setInterval(checkDay,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDay()});
</script></html>
